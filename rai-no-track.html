<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>tracking switch</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#b9d2ec;font:18px/1.5 Georgia,serif;color:#141414;padding:16px;box-sizing:border-box}
main{background:#fff;padding:28px 32px;max-width:420px;box-shadow:6px 6px 0 #c8102e;text-align:center}
b{font-size:22px}button{font:inherit;margin:16px 6px 0;padding:8px 16px;border:2px solid #141414;background:#fff;cursor:pointer}
button.on{background:#141414;color:#fff}a{color:#c8102e}</style></head>
<body><main><b id="s"></b><p id="d"></p>
<button id="off" class="on">don't count me</button><button id="on">count me again</button>
<p><a href="/">back to my room</a></p></main>
<script>
const s=document.getElementById('s'),d=document.getElementById('d');
function show(){let off=false;try{off=localStorage.getItem('umami.disabled')==='1'}catch(e){}
 s.textContent=off?'✓ you are not being counted':'you are being counted';
 d.textContent=off?'Visits from this browser on this device won\'t show in Umami. Open this page once on each device and browser you use.':'Visits from this browser show up in Umami like any visitor.'}
document.getElementById('off').onclick=()=>{try{localStorage.setItem('umami.disabled','1')}catch(e){}show()};
document.getElementById('on').onclick=()=>{try{localStorage.removeItem('umami.disabled')}catch(e){}show()};
try{localStorage.setItem('umami.disabled','1')}catch(e){}show();
</script></body></html>
